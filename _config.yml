# Site settings
course_name: Learning in Robotics
course_description: "Learning in Robotics develops the mathematical and algorithmic foundations for robots that estimate, predict, plan, control, and learn. The course covers probabilistic state estimation, optimal control, sequential decision making, imitation learning, reinforcement learning, and modern robot learning, with connections to foundation models, vision-language-action systems, and world models."
course_semester: "Spring 2027"

# Typography preset: modern | editorial | technical | minimal
# Change this one value and restart Jekyll to audition a different type system.
typography: modern

title: "Learning in Robotics"
tagline: "Robot Learning, Reinforcement Learning, and Embodied AI at UVA"

description: "Learning in Robotics is a graduate course at the University of Virginia taught by Prof. Madhur Behl. The course covers probabilistic state estimation, planning and control, imitation learning, reinforcement learning, model-based learning, and connections to modern embodied AI, robot foundation models, vision-language-action models, and world models."

baseurl: "/robotlearning" # the subpath of your site, e.g. /blog/
url: "https://linklab-uva.github.io" # the base hostname & protocol for your site

schoolname: "University of Virginia"
#schoolurl: "https://hogwarts.edu"
#twitter_username: username

address: |
    151 Engineer's Way
    Olsson Hall - Link Lab
    Charlottesville, VA

# Set your Google Analytics tracking ID (set up yours at http://www.google.com/analytics/)
google_analytics: G-NFRE4D2LJT

### Do not change the followings unless you know what you are doing ###

# Build settings
markdown: kramdown

# Other options
permalink: blog/:year/:month/:title
excerpt_separator: "<!--more-->"

include: ['_images', '_css']
exclude: ['develop', 'README-VISUAL-REFRESH.md', 'TYPOGRAPHY.md', 'GITHUB-PAGES-FIX.md', 'vendor']

dateformat: "%m/%d/%Y"

future: true
collections:
    events:
        output: true
    lectures:
        output: true
    assignments:
        output: true
    announcements:
        output: false


defaults:
  - scope:
      path: ""
      type: "assignments"
    values:
      layout: "assignment"


plugins:
  - jekyll-seo-tag
  - jekyll-sitemap